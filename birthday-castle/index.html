<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#08091d"><title>星尘城堡 · 生日蛋糕</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070819;font-family:system-ui,-apple-system,'PingFang SC',sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.tip{position:fixed;bottom:5%;width:100%;text-align:center;color:#efdeffbb;font-size:12px;letter-spacing:3px;pointer-events:none;text-shadow:0 0 12px #ac85fa}</style></head><body><canvas id="sky"></canvas><div class="tip">轻触星空 · 点亮流星</div><script>
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,stars=[],sparks=[],t=0;
function rnd(a,b){return a+Math.random()*(b-a)}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:210},()=>({x:Math.random()*W,y:Math.random()*H,r:rnd(.35,1.7),o:rnd(.15,.8),p:rnd(0,7),s:rnd(.3,1.4)}))}addEventListener('resize',resize);resize();
function dot(x,y,r,color,blur=0){ctx.save();ctx.shadowBlur=blur;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fillStyle=fill;ctx.fill()}
function line(points,color,width=1,blur=0){ctx.save();ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.shadowColor=color;ctx.shadowBlur=blur;ctx.stroke();ctx.restore()}
function spire(x,y,w,h,phase){const glow=`hsla(${265+phase*22},95%,78%,.84)`;ctx.save();ctx.shadowColor='#bfa6ff';ctx.shadowBlur=22;line([[x-w/2,y],[x-w/2,y-h*.67],[x,y-h],[x+w/2,y-h*.67],[x+w/2,y]],glow,1.8,12);line([[x-w*.34,y],[x-w*.34,y-h*.61],[x+w*.34,y-h*.61],[x+w*.34,y]],'#a9deff99',1.1,7);dot(x,y-h,2.6,'#ffe8b3',12);for(let j=0;j<3;j++){let wy=y-h*.52+j*h*.18;ellipse(x,wy,w*.12,h*.062,'#b8deff');dot(x,wy,1,'#fff0cd',6)}ctx.restore()}
function castle(cx,cy,s){ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.globalAlpha=.88;const base=ctx.createLinearGradient(0,-250,0,80);base.addColorStop(0,'#e2bdff');base.addColorStop(1,'#709dff');ctx.shadowColor='#a67cff';ctx.shadowBlur=23;line([[-155,18],[-155,-58],[-111,-58],[-111,-124],[-65,-124],[-65,-85],[-28,-85],[-28,-173],[22,-173],[22,-89],[63,-89],[63,-133],[111,-133],[111,-59],[155,-59],[155,18]],base,2.1,15);
spire(-124,-57,49,125,1);spire(-81,-122,53,145,2);spire(-3,-171,69,176,0);spire(87,-130,54,143,1);spire(132,-58,45,112,2);
line([[-174,20],[-175,45],[-140,45],[-140,33],[-90,33],[-90,46],[-29,46],[-29,34],[31,34],[31,46],[92,46],[92,34],[144,34],[144,46],[176,46],[176,20]],'#d1b5ff',2,9);
for(let k=-5;k<=5;k++){let x=k*28;let y=18+(Math.abs(k)%2)*4;dot(x,y,1.8,'#f5e1ff',8)}
ctx.beginPath();ctx.moveTo(-29,45);ctx.lineTo(-29,9);ctx.quadraticCurveTo(0,-30,29,9);ctx.lineTo(29,45);ctx.strokeStyle='#ffdba6';ctx.lineWidth=2;ctx.stroke();for(let i=0;i<90;i++){const x=rnd(-171,171),y=rnd(-164,47);if(Math.random()<.64)dot(x,y,rnd(.45,1.5),Math.random()>.5?'#d5bbff':'#8ddaff',5)}ctx.restore()}
function cake(cx,cy,s){ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);const glow=ctx.createRadialGradient(0,68,2,0,68,165);glow.addColorStop(0,'#d6adff80');glow.addColorStop(1,'#bd73ff00');ellipse(0,68,172,70,glow);ellipse(0,88,155,30,'#7d7de444');ellipse(0,78,150,27,'#dfd5ff');ellipse(0,75,136,20,'#afa6f3');
// base tier
ctx.fillStyle='#131c52';ctx.beginPath();ctx.moveTo(-116,16);ctx.lineTo(-116,68);ctx.bezierCurveTo(-90,97,89,97,116,68);ctx.lineTo(116,16);ctx.closePath();ctx.fill();ellipse(0,17,116,40,'#f1ddff');ellipse(0,11,108,32,'#edbdff');
// upper tier
ctx.fillStyle='#1a194b';ctx.beginPath();ctx.moveTo(-77,-45);ctx.lineTo(-77,15);ctx.bezierCurveTo(-60,42,60,42,77,15);ctx.lineTo(77,-45);ctx.closePath();ctx.fill();ellipse(0,-45,77,28,'#ecd4ff');ellipse(0,-49,72,23,'#fbcaf5');
// dripping icing
for(let i=0;i<19;i++){const x=-108+i*12;const y=20+Math.sqrt(Math.max(0,1-(x/118)**2))*13;line([[x,y-6],[x,y+rnd(6,21)]],['#ffccff','#a5f4ff','#e0ccff'][i%3],rnd(3.5,6),8)}
for(let i=0;i<14;i++){const x=-70+i*10;const y=-33+Math.sqrt(Math.max(0,1-(x/80)**2))*8;line([[x,y-5],[x,y+rnd(2,13)]],['#f6ccff','#c6e9ff'][i%2],3.5,7)}
const colors=['#64d7ff','#fd8cd9','#ffde74','#ba8dff','#82ffdf'];for(let i=0;i<155;i++){const x=rnd(-113,113),y=rnd(-2,78);if(x*x/13500+(y-34)*(y-34)/1900>1.25)continue;dot(x,y,rnd(.8,2.5),colors[Math.floor(rnd(0,5))],rnd(2,11))}
for(let i=0;i<74;i++){let a=rnd(0,6.28),r=rnd(5,72);dot(Math.cos(a)*r,-49+Math.sin(a)*r*.32,rnd(1,2.8),colors[Math.floor(rnd(0,5))],7)}
// candle and warm flame
ctx.save();ctx.shadowColor='#f5c2ff';ctx.shadowBlur=12;ctx.fillStyle='#c5dbff';ctx.fillRect(-5,-118,10,51);ctx.restore();for(let i=0;i<5;i++)line([[-5,-112+i*9],[5,-106+i*9]],'#f3a6fb',2);const flame=t*.055;ctx.save();ctx.translate(0,-131);ctx.scale(1+.07*Math.sin(flame),1+.1*Math.sin(flame*1.3));let g=ctx.createRadialGradient(0,1,2,0,-15,32);g.addColorStop(0,'#ffffff');g.addColorStop(.25,'#fff8b7');g.addColorStop(.65,'#ffae51');g.addColorStop(1,'#ffae5100');ctx.fillStyle=g;ctx.shadowBlur=32;ctx.shadowColor='#ffd88b';ctx.beginPath();ctx.moveTo(0,-35);ctx.bezierCurveTo(-16,-14,-13,4,0,10);ctx.bezierCurveTo(14,3,14,-14,0,-35);ctx.fill();ctx.restore();ctx.restore()}
function burst(x,y,n=40){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),v=rnd(1,4.8);sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(35,85),max:85,hue:rnd(175,330),r:rnd(.7,2.6)})}}canvas.addEventListener('pointerdown',e=>burst(e.clientX,e.clientY,65));
function frame(){t++;let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#06091e');g.addColorStop(.55,'#171333');g.addColorStop(1,'#271245');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let cx=W/2,cy=H*.37;let neb=ctx.createRadialGradient(cx,cy,4,cx,cy,Math.min(W,H)*.74);neb.addColorStop(0,'#6742ad32');neb.addColorStop(1,'#6243aa00');ctx.fillStyle=neb;ctx.fillRect(0,0,W,H);for(const p of stars){const a=p.o*(.67+.33*Math.sin(t*.025*p.s+p.p));dot(p.x,p.y,p.r,`rgba(235,224,255,${a})`,p.r*5)}
const size=Math.min(W/430,H/820,1.12);castle(cx,H*.37,size);cake(cx,H*.7,size*1.12);for(let i=0;i<6;i++){let a=t*.006+i*6.28/6;let x=cx+Math.sin(a*1.17+i)*W*.31,y=H*(.4+.28*Math.cos(a*.71+i));dot(x,y,1.5+Math.sin(a*3)*.8,'#ffe9af',15)}
if(t%17===0){sparks.push({x:rnd(0,W),y:rnd(H*.14,H*.84),vx:rnd(-.6,.6),vy:rnd(-1.7,-.5),life:85,max:85,hue:rnd(190,320),r:rnd(.7,1.9)})}for(let i=sparks.length-1;i>=0;i--){let p=sparks[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.009;p.life--;dot(p.x,p.y,p.r,`hsla(${p.hue},100%,82%,${Math.max(0,p.life/p.max)})`,8);if(p.life<=0)sparks.splice(i,1)}requestAnimationFrame(frame)}frame();
</script></body></html>
